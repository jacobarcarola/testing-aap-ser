---
- name: React to GitHub webhook events
  hosts: all
  sources:
    - name: my_github
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Trigger remediation on push
      condition: event.payload.ref is defined
      action:
        run_job_template:
          name: MyRemediationJob
          organization: Default
          job_args:
            extra_vars:
              event_action: "{{ event.payload.action | default('unknown') }}"
              repo: "{{ event.payload.repository.full_name | default('unknown') }}"
              sender: "{{ event.payload.sender.login | default('unknown') }}"
